# CI for the Athanor daemon (ROADMAP M0-T8).
# CGO is required: internal/store uses mattn/go-sqlite3 (ADR 0003),
# so every job sets CGO_ENABLED=1 via the Makefile.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Vet
        run: make vet

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Test (race detector)
        run: make test-race

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m